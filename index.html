<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
    <table>
            <tr>
                <th colspan="4"></th>
            </tr>
            <tr>
                <td onclick="One()">1</td>
                <td onclick="Two()">2</td>
                <td onclick="Three()">3</td>
                <td onclick="plus()">+</td>
            </tr>
            <tr>
                <td onclick="Four()">4</td>
                <td onclick="Five()">5</td>
                <td onclick="Six()">6</td>
                <td onclick="minus()">-</td>
            </tr>
            <tr>
                <td onclick="Seven()">7</td>
                <td onclick="Eight()">8</td>
                <td onclick="Nine()">9</td>
                <td onclick="multiple()">*</td>
            </tr>
            <tr>
                <td onclick="dot()">.</td>
                <td onclick="Zero()">0</td>
                <td onclick="divide()">/</td>
                <td onclick="remove()">del</td>
            </tr>
            <tr>
                <td colspan="2" onclick="clears()">clear</td>
                <td colspan="2" onclick="enter()">Enter</td>
            </tr>
    </table>
    <script src="main.js"></script>
</body>
</html>
